<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar senha — CARÔMETRO</title>
  <script src="carometro-config.js?v=3"></script>
  <style>
    :root{--navy:#17233a;--blue:#356ae6;--muted:#667085;--line:#d0d5dd;--danger:#b42318}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef3ff,#f8faff);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(460px,100%);padding:34px;border:1px solid #e4e7ec;border-radius:18px;background:#fff;box-shadow:0 18px 46px #1b31531a}.logo{font-weight:850;font-size:18px;margin-bottom:34px}.mark{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:8px;border-radius:10px;background:#82aeff;color:#14203a}h1{margin:0 0 8px;font-size:28px;letter-spacing:-.8px}p{margin:0 0 25px;color:var(--muted);line-height:1.5}.field{margin-bottom:17px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:700}input{width:100%;min-height:47px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;outline:0}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dfe8ff}.btn{width:100%;min-height:46px;border:0;border-radius:9px;background:var(--blue);color:#fff;font:inherit;font-weight:750;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.link{display:block;margin:16px auto 0;border:0;background:transparent;color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}.error{margin:-4px 0 14px;color:var(--danger);font-size:14px}.hidden{display:none!important}.success{color:#08784b;font-weight:650}@media(max-width:520px){body{padding:16px}.card{padding:27px 22px;border-radius:15px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><span class="mark">✦</span>CARÔMETRO</div>
    <h1>Criar nova senha</h1>
    <p id="resetStatus">Validando o link de recuperação…</p>
    <form id="resetForm" class="hidden">
      <div class="field"><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div>
      <div class="field"><label for="confirmation">Confirme a nova senha</label><input id="confirmation" type="password" autocomplete="new-password" minlength="6" required></div>
      <p id="error" class="error hidden"></p>
      <button id="save" class="btn" type="submit">Salvar nova senha</button>
      <button id="cancel" class="link" type="button">Cancelar e voltar ao login</button>
    </form>
    <button id="backToLogin" class="link" type="button">Voltar ao login</button>
  </main>
  <script>
    if (window.CAROMETRO_RUNTIME_CONFIG?.backendConfigured) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script><script src="reset-password.js?v=3"><\/script>');
    } else {
      document.getElementById('resetForm').classList.add('hidden');
      document.getElementById('resetStatus').textContent = 'O ambiente comercial ainda está em preparação.';
    }
  </script>
</body>
</html>
