<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17233a">
  <title>CARÔMETRO — endereço atualizado</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #17233a; background: linear-gradient(145deg, #eef3fb, #f8fafc); }
    main { width: min(620px, 100%); padding: clamp(28px, 6vw, 52px); border: 1px solid #d9e2f0; border-radius: 20px; background: #fff; box-shadow: 0 24px 70px rgba(23, 35, 58, .12); text-align: center; }
    .mark { width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 15px; display: grid; place-items: center; background: #dce8ff; color: #234f9f; font-size: 25px; font-weight: 900; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 42px); letter-spacing: -1.3px; }
    p { margin: 0 auto 26px; max-width: 500px; color: #52627a; font-size: 17px; line-height: 1.65; }
    a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 22px; border-radius: 10px; background: #356ae6; color: #fff; font-weight: 750; text-decoration: none; }
    a:hover, a:focus-visible { background: #2859ca; outline: 3px solid #bfd1ff; outline-offset: 3px; }
    small { display: block; margin-top: 22px; color: #7a8799; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Este endereço foi encerrado</h1>
    <p>O CARÔMETRO Paulo Freire agora funciona no ambiente Comercial. Use o botão abaixo para acessar o sistema atualizado.</p>
    <a href="https://carometro-comercial-hml-passos77.pages.dev/">Acessar o CARÔMETRO Comercial</a>
    <small>Se você ainda não tiver acesso, solicite um convite ao administrador da escola.</small>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        localStorage.clear();
        sessionStorage.clear();
      } catch (_) {
        // A página de encerramento continua funcional mesmo sem essas APIs.
      }
    })();
  </script>
</body>
</html>
