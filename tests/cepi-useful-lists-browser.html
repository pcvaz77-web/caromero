<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Prévia local · Imprimir listas</title>
<style>:root{--navy:#17233a;--blue:#356ae6;--muted:#667085}*{box-sizing:border-box}body{font:15px Inter,system-ui,sans-serif;background:#17213b;margin:0;color:var(--navy)}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;display:grid;place-items:center;background:#152143aa;padding:16px}.modal{width:min(1050px,100%);max-height:94vh;overflow:auto;background:white;border-radius:16px}.modal-head{padding:20px 24px;border-bottom:1px solid #ddd}.cepi-workspace-body{padding:20px}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:white;border:1px solid #d0d5dd;color:#344054}.meta{color:#63708e}.cepi-kicker{font-size:11px;color:#526ae5;font-weight:bold}.close{float:right;border:0;background:white;font-size:26px;cursor:pointer}input,select{padding:8px;border:1px solid #cbd5e1;border-radius:7px}#cepiWorkspaceMessage{color:#a00}</style>
<div id="cepiModal"><div id="cepiHome"></div></div>
<script>
const school='11111111-1111-4111-8111-111111111111',user='22222222-2222-4222-8222-222222222222',classId='44444444-4444-4444-8444-000000000001';
const rows={school_members:[{role:'coordinator',school_id:school,user_id:user,status:'active'}],cepi_tests:[],cepi_test_questions:[],cepi_question_bank:[],cepi_exam_headers:[{school_id:school,school_name:'CEPI Santa Bárbara'}],cepi_groups:[{id:'elective',school_id:school,kind:'eletiva',title:'Descobertas do saber',academic_year:2026,semester:2,active:true,responsible_user_id:'teacher-1'},{id:'club',school_id:school,kind:'clube',title:'Criando jogos',academic_year:2026,semester:2,active:true,responsible_user_id:'teacher-2'}],cepi_group_classes:[],cepi_group_students:[{id:'link-1',school_id:school,group_id:'elective',student_id:'student-1',ended_at:null},{id:'link-2',school_id:school,group_id:'club',student_id:'student-1',ended_at:null}],cepi_tutors:[{id:'tutor-1',school_id:school,display_name:'Professor Cícero'}],cepi_tutor_students:[{id:'assignment-1',school_id:school,student_id:'student-1',tutor_id:'tutor-1',active:true}],observation_options:[],classes:[{id:classId,school_id:school,name:'6B',archived_at:null}],students:[{id:'student-1',school_id:school,full_name:'1. João Silva',class_id:classId,enrollment_status:'active'},{id:'student-2',school_id:school,full_name:'2. Pedro Souza',class_id:classId,enrollment_status:'active'}]};
window.getActiveSchoolId=()=>school;
class Query{constructor(name){this.name=name;this.filters=[]}select(){return this}eq(key,value){this.filters.push([key,value]);return this}is(key,value){this.filters.push([key,value]);return this}order(){return this}range(){return Promise.resolve({data:this.find(),error:null})}maybeSingle(){return Promise.resolve({data:this.find()[0]||null,error:null})}then(resolve){resolve({data:this.find(),error:null})}find(){return(rows[this.name]||[]).filter(row=>this.filters.every(([key,value])=>row[key]===value))}}
window.db={auth:{getUser:async()=>({data:{user:{id:user}},error:null})},rpc:async(name)=>name==='list_cepi_tutor_candidates'?{data:[{user_id:'teacher-1',full_name:'Professora Ana'},{user_id:'teacher-2',full_name:'Professor Beto'}],error:null}:{data:{enabled:true},error:null},from:name=>new Query(name)};
</script>
<script src="../cepi-useful-lists.js"></script><script src="../cepi-workspace.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{document.getElementById('cepiPrintListsCard').classList.remove('hidden');document.getElementById('cepiPrintListsCard').click();for(let i=0;i<50&&!document.getElementById('cepiUsefulClass');i++)await new Promise(resolve=>setTimeout(resolve,20));document.getElementById('cepiUsefulClass').value=classId;document.getElementById('cepiUsefulClass').dispatchEvent(new Event('change'));});</script>
</html>
