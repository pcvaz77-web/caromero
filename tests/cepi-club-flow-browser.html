<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Prévia local · Clube CEPI</title>
<style>:root{--navy:#17233a;--blue:#356ae6;--muted:#667085}*{box-sizing:border-box}body{font:15px Inter,system-ui,sans-serif;background:#17213b;margin:0;color:var(--navy)}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;display:grid;place-items:center;background:#152143aa;padding:16px}.modal{width:min(1050px,100%);max-height:94vh;overflow:auto;background:white;border-radius:16px}.modal-head{padding:20px 24px;border-bottom:1px solid #ddd}.cepi-workspace-body{padding:20px}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:white;border:1px solid #d0d5dd;color:#344054}.cepi-feature-card{padding:20px;background:white;border:1px solid #ddd}.meta{color:#63708e}.cepi-kicker{font-size:11px;color:#526ae5;font-weight:bold}.close{float:right;border:0;background:white;font-size:26px;cursor:pointer}input,select,textarea{padding:8px;border:1px solid #cbd5e1;border-radius:7px}#cepiWorkspaceMessage{color:#a00}</style>
<div id="cepiModal"><div id="cepiHome"></div></div>
<script>
const school='11111111-1111-4111-8111-111111111111',user='22222222-2222-4222-8222-222222222222';
const cls=['6A','7A','1A'].map((name,index)=>({id:`44444444-4444-4444-8444-${String(index+1).padStart(12,'0')}`,school_id:school,name,archived_at:null}));
const pupils=[{id:'a1',full_name:'Ana Silva',class_id:cls[0].id,enrollment_status:'active',photo_path:`${school}/ana.png`},{id:'a2',full_name:'Bruno Costa',class_id:cls[0].id,enrollment_status:'active'},{id:'a3',full_name:'Carla Lima',class_id:cls[1].id,enrollment_status:'active'},{id:'a4',full_name:'Daniel Souza',class_id:cls[2].id,enrollment_status:'active'}].map(item=>({...item,school_id:school,photo_path:item.photo_path||null}));
const rows={school_members:[{role:'coordinator',school_id:school,user_id:user,status:'active'}],cepi_tests:[],cepi_test_questions:[],cepi_question_bank:[],cepi_exam_headers:[],cepi_groups:[],cepi_group_classes:[],cepi_group_students:[],observation_options:[],classes:cls,students:pupils};
window.testRows=rows;window.getActiveSchoolId=()=>school;
class Query{constructor(name){this.name=name;this.filters=[];this.singleValue=false}select(){return this}eq(key,value){this.filters.push([key,value]);return this}is(){return this}order(){return this}range(){return Promise.resolve({data:this.find(),error:null})}maybeSingle(){return Promise.resolve({data:this.find()[0]||null,error:null})}insert(value){this.newRows=Array.isArray(value)?value:[value];return this}update(value){this.patch=value;return this}find(){return (rows[this.name]||[]).filter(row=>this.filters.every(([key,value])=>row[key]===value))}single(){return new Promise(resolve=>this.then(result=>resolve({data:result.data[0]||null,error:null})))}then(resolve){if(this.newRows){const inserted=this.newRows.map(item=>({id:crypto.randomUUID(),...item}));rows[this.name].push(...inserted);resolve({data:inserted,error:null});return}const found=this.find();if(this.patch)found.forEach(item=>Object.assign(item,this.patch));resolve({data:found,error:null})}}
window.db={auth:{getUser:async()=>({data:{user:{id:user}},error:null})},rpc:async(name)=>name==='list_cepi_tutor_candidates'?{data:[{user_id:'teacher-1',full_name:'Professora Maria',role:'teacher'},{user_id:'teacher-2',full_name:'Professor João',role:'teacher'},{user_id:'coordinator-1',full_name:'Coordenadora Ana',role:'coordinator'}],error:null}:{data:{enabled:true},error:null},from:name=>new Query(name),storage:{from:()=>({createSignedUrls:async(paths)=>({data:paths.map(path=>({path,signedUrl:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL/nwAAAABJRU5ErkJggg=='})),error:null})})}};
</script>
<script src="../cepi-workspace.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{document.querySelector('[data-cepi-workspace="clube"]').click();for(let i=0;i<50&&document.getElementById('cepiWorkspaceNew').classList.contains('hidden');i++)await new Promise(resolve=>setTimeout(resolve,20));document.getElementById('cepiWorkspaceNew').click();});</script>
</html>
